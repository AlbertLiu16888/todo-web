<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 樂點創意報價單系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        :root { --primary: #6366f1; --secondary: #8b5cf6; }
        body { font-family: 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); min-height: 100vh; color: #fff; }
        .header { background: linear-gradient(135deg, var(--primary), var(--secondary)); padding: 20px; text-align: center; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .card { background: rgba(255,255,255,0.08); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .card h3 { color: #a78bfa; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-bottom: 15px; }
        .form-label { color: #a78bfa; font-weight: 500; }
        .form-control, .form-select { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); border: none; }
        .btn-success { background: #10b981; border: none; }
        .item-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
        .item-row input { flex: 1; min-width: 100px; }
        .item-row .qty { width: 70px; flex: none; }
        .item-row .unit { width: 60px; flex: none; }
        .item-row .price { width: 100px; flex: none; }
        .item-row .del-btn { background: #ef4444; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
        .nav-tabs .nav-link { color: rgba(255,255,255,0.7); border: none; }
        .nav-tabs .nav-link.active { background: transparent; color: #fff; border-bottom: 2px solid var(--primary); }
        .total-section { background: rgba(99,102,241,0.2); padding: 15px; border-radius: 8px; margin-top: 20px; }
        .total-row { display: flex; justify-content: space-between; padding: 5px 0; }
        .grand-total { font-size: 1.3rem; font-weight: bold; color: #22c55e; border-top: 2px solid rgba(255,255,255,0.3); padding-top: 10px; margin-top: 10px; }
        
        /* 報價單預覽樣式 */
        #preview-container { display: none; background: #fff; padding: 20px; }
        .quote-page { background: #fff; color: #000; padding: 20mm; font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
        .quote-title { text-align: center; font-size: 18px; font-weight: bold; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
        .quote-info { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 11px; margin-bottom: 15px; }
        .quote-table { width: 100%; border-collapse: collapse; font-size: 9px; margin-bottom: 15px; }
        .quote-table th, .quote-table td { border: 1px solid #ccc; padding: 4px 6px; text-align: left; }
        .quote-table th { background: #f0f0f0; }
        .section-header { background: #f5f5f5; font-weight: bold; padding: 5px; margin: 10px 0 5px; }
        .quote-total { text-align: right; font-size: 11px; }
        .quote-total-row { padding: 3px 0; }
        .grand-total { font-size: 14px; font-weight: bold; color: #2e7d32; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📝 樂點創意報價單系統</h1>
        <p>快速產製專業報價單</p>
    </div>
    <div class="container">
        <ul class="nav nav-tabs mb-3">
            <li class="nav-item"><a class="nav-link active" href="#basic" data-bs-toggle="tab">基本資料</a></li>
            <li class="nav-item"><a class="nav-link" href="#standard" data-bs-toggle="tab">標配項目</a></li>
            <li class="nav-item"><a class="nav-link" href="#optional" data-bs-toggle="tab">選配加購</a></li>
            <li class="nav-item"><a class="nav-link" href="#preview" data-bs-toggle="tab">預覽/產出</a></li>
        </ul>
        <div class="tab-content">
            <!-- 基本資料 -->
            <div class="tab-pane fade show active" id="basic">
                <div class="card">
                    <h3>📋 基本資訊</h3>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">客戶名稱 *</label>
                            <input type="text" class="form-control" id="clientName" placeholder="輸入客戶名稱">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">活動名稱/主題 *</label>
                            <input type="text" class="form-control" id="eventName" placeholder="例如：謎走大富翁">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">報價日期</label>
                            <input type="date" class="form-control" id="quoteDate">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">報價效期</label>
                            <input type="date" class="form-control" id="validDate">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">活動日期</label>
                            <input type="date" class="form-control" id="eventDate">
                        </div>
                        <div class="col-md-12 mb-3">
                            <label class="form-label">活動地點</label>
                            <input type="text" class="form-control" id="location" placeholder="輸入活動地點">
                        </div>
                    </div>
                </div>
                <div class="card">
                    <h3>👤 客戶確認欄</h3>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">公司名稱</label>
                            <input type="text" class="form-control" id="companyName" value="異品科技股份有限公司">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">統一編號</label>
                            <input type="text" class="form-control" id="taxId" value="16356300">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">聯絡人</label>
                            <input type="text" class="form-control" id="contactPerson" value="何欣樺 Joann Ho">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">電話</label>
                            <input type="tel" class="form-control" id="contactPhone" value="0988-956-606">
                        </div>
                        <div class="col-md-12 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="contactEmail" value="service@funideas.com.tw">
                        </div>
                    </div>
                </div>
                <button class="btn btn-primary btn-lg" onclick="goToTab('standard')">下一步：標配項目 →</button>
            </div>
            <!-- 標配項目 -->
            <div class="tab-pane fade" id="standard">
                <div class="card">
                    <h3>✅ 標配項目</h3>
                    <div id="standardItems"></div>
                    <button class="btn btn-secondary mt-2" onclick="addStandardItem()">+ 新增項目</button>
                </div>
                <div class="total-section">
                    <div class="total-row"><span>標配小計：</span><span id="standardTotal">NT$ 0</span></div>
                </div>
                <div class="d-flex gap-2 mt-3">
                    <button class="btn btn-secondary" onclick="goToTab('basic')">← 上一步</button>
                    <button class="btn btn-primary" onclick="goToTab('optional')">下一步：選配加購 →</button>
                </div>
            </div>
            <!-- 選配加購 -->
            <div class="tab-pane fade" id="optional">
                <div class="card">
                    <h3>🎯 選配加購</h3>
                    <div class="mb-3">
                        <label class="form-label">選擇類別新增項目</label>
                        <select class="form-select" id="optionalCategory" onchange="addOptionalCategory()">
                            <option value="">-- 選擇類別 --</option>
                            <option value="其他任務設計">其他任務設計</option>
                            <option value="影像製作">影像製作</option>
                            <option value="視覺設計輸出">視覺設計輸出</option>
                            <option value="硬體設備">硬體設備</option>
                            <option value="其他">其他</option>
                            <option value="場地/餐飲/住宿">場地/餐飲/住宿</option>
                        </select>
                    </div>
                    <div id="optionalCategories"></div>
                </div>
                <div class="total-section">
                    <div class="total-row"><span>標配小計：</span><span id="optStandardTotal">NT$ 0</span></div>
                    <div class="total-row"><span>選配小計：</span><span id="optionalTotal">NT$ 0</span></div>
                    <div class="total-row"><span>合計未稅：</span><span id="subtotalNoTax">NT$ 0</span></div>
                    <div class="total-row"><span>稅額 (5%)：</span><span id="taxAmount">NT$ 0</span></div>
                    <div class="total-row grand-total"><span>總價含稅：</span><span id="grandTotal">NT$ 0</span></div>
                </div>
                <div class="d-flex gap-2 mt-3">
                    <button class="btn btn-secondary" onclick="goToTab('standard')">← 上一步</button>
                    <button class="btn btn-success" onclick="generatePDF()">📄 產生 PDF</button>
                </div>
            </div>
            <!-- 預覽 -->
            <div class="tab-pane fade" id="preview">
                <div class="card">
                    <h3>📄 報價單預覽</h3>
                    <button class="btn btn-primary mb-3" onclick="updatePreview()">🔄 更新預覽</button>
                    <div id="preview-content"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // 預設標配項目
    const defaultStandardItems = [
        {name:'專案活動籌辦費', qty:1, unit:'式', price:35000},
        {name:'事前會議', qty:1, unit:'式', price:0},
        {name:'任務關卡設計', qty:1, unit:'式', price:0},
        {name:'活動場地佈置 (含進撤場作業)', qty:1, unit:'式', price:0},
        {name:'謎走大富翁包含：城市任務-5關、農田任務-7關', qty:1, unit:'式', price:0},
        {name:'照片回顧：現場製作PPT', qty:1, unit:'式', price:0},
        {name:'活動紀錄照片：提供雲端連結', qty:1, unit:'式', price:0},
        {name:'活動中文主持人', qty:1, unit:'人', price:0},
        {name:'工作團隊', qty:1, unit:'式', price:0},
        {name:'平面攝影師：靜態攝影', qty:1, unit:'機', price:0},
        {name:'道具運輸費', qty:1, unit:'式', price:0},
        {name:'差旅費', qty:1, unit:'式', price:0},
    ];
    
    const optionalCategories = {
        '其他任務設計': [
            {name:'菁英挑戰賽', qty:0, unit:'式', price:8000},
            {name:'城市任務-隔離病棟', qty:0, unit:'組', price:8000},
            {name:'客製記憶翻牌', qty:0, unit:'組', price:5000},
            {name:'客製地圖', qty:0, unit:'張', price:5000},
        ],
        '影像製作': [
            {name:'平面攝影師', qty:0, unit:'半日', price:8000},
            {name:'動態攝影師', qty:0, unit:'半日', price:8000},
            {name:'空拍錄影', qty:0, unit:'式', price:8000},
            {name:'活動紀錄影片後製', qty:0, unit:'部', price:12000},
        ],
        '視覺設計輸出': [
            {name:'主視覺設計', qty:0, unit:'式', price:10000},
            {name:'主視覺輸出', qty:0, unit:'式', price:28000},
            {name:'活動布條', qty:0, unit:'條', price:2000},
            {name:'迎賓H展架', qty:0, unit:'組', price:3000},
        ],
        '硬體設備': [
            {name:'音響設備', qty:0, unit:'式', price:30000},
            {name:'燈光設備', qty:0, unit:'式', price:30000},
            {name:'投影設備', qty:0, unit:'組', price:8000},
            {name:'舞台結構', qty:0, unit:'式', price:10000},
        ],
        '其他': [
            {name:'雙語主持人', qty:0, unit:'人', price:30000},
            {name:'1日保險', qty:0, unit:'人', price:50},
            {name:'公共意外險', qty:0, unit:'式', price:15000},
            {name:'交通', qty:0, unit:'台', price:16000},
        ],
        '場地/餐飲/住宿': [
            {name:'飲用水', qty:0, unit:'箱', price:480},
            {name:'場地費用', qty:0, unit:'時段', price:0},
            {name:'餐飲費用', qty:0, unit:'人', price:0},
            {name:'住宿', qty:0, unit:'間', price:0},
        ]
    };
    
    // 初始化
    document.getElementById('quoteDate').valueAsDate = new Date();
    const validDate = new Date();
    validDate.setDate(validDate.getDate() + 14);
    document.getElementById('validDate').valueAsDate = validDate;
    
    defaultStandardItems.forEach(item => addStandardItem(item.name, item.qty, item.unit, item.price));
    calcTotal();
    
    function goToTab(tabId) {
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        document.querySelector(`[href="#${tabId}"]`).classList.add('active');
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('show', 'active'));
        document.getElementById(tabId).classList.add('show', 'active');
        if(tabId === 'optional') { calcTotal(); updatePreview(); }
    }
    
    function addStandardItem(name='', qty=1, unit='式', price=0) {
        const container = document.getElementById('standardItems');
        const div = document.createElement('div');
        div.className = 'item-row';
        div.innerHTML = `<input type="text" class="form-control" placeholder="項目名稱" value="${name}"><input type="number" class="form-control qty" placeholder="數量" value="${qty}" onchange="calcTotal()"><input type="text" class="form-control unit" placeholder="單位" value="${unit}"><input type="number" class="form-control price" placeholder="單價" value="${price}" onchange="calcTotal()"><button class="del-btn" onclick="this.parentElement.remove();calcTotal()">✕</button>`;
        container.appendChild(div);
    }
    
    function addOptionalCategory() {
        const cat = document.getElementById('optionalCategory').value;
        if(!cat) return;
        const container = document.getElementById('optionalCategories');
        const catDiv = document.createElement('div');
        catDiv.className = 'card';
        catDiv.innerHTML = `<h4>${cat}</h4><div id="cat-${cat.replace(/\//g,'-')}"></div>`;
        container.appendChild(catDiv);
        const itemsContainer = catDiv.querySelector(`div`);
        if(optionalCategories[cat]) {
            optionalCategories[cat].forEach(item => addOptionalItem(cat, item.name, item.qty, item.unit, item.price));
        }
        document.getElementById('optionalCategory').value = '';
        calcTotal();
    }
    
    function addOptionalItem(cat, name='', qty=0, unit='式', price=0) {
        const catId = cat.replace(/\//g,'-');
        const container = document.getElementById(`cat-${catId}`);
        if(!container) return;
        const div = document.createElement('div');
        div.className = 'item-row';
        div.innerHTML = `<input type="text" class="form-control" placeholder="項目名稱" value="${name}"><input type="number" class="form-control qty" placeholder="數量" value="${qty}" onchange="calcTotal()"><input type="text" class="form-control unit" placeholder="單位" value="${unit}"><input type="number" class="form-control price" placeholder="單價" value="${price}" onchange="calcTotal()"><button class="del-btn" onclick="this.parentElement.remove();calcTotal()">✕</button>`;
        container.appendChild(div);
    }
    
    function calcTotal() {
        let standardTotal = 0;
        document.querySelectorAll('#standardItems .item-row').forEach(row => {
            const qty = parseFloat(row.querySelector('.qty').value) || 0;
            const price = parseFloat(row.querySelector('.price').value) || 0;
            standardTotal += qty * price;
        });
        document.getElementById('standardTotal').textContent = 'NT$ ' + standardTotal.toLocaleString();
        document.getElementById('optStandardTotal').textContent = 'NT$ ' + standardTotal.toLocaleString();
        
        let optionalTotal = 0;
        document.querySelectorAll('#optionalCategories .item-row').forEach(row => {
            const qty = parseFloat(row.querySelector('.qty').value) || 0;
            const price = parseFloat(row.querySelector('.price').value) || 0;
            optionalTotal += qty * price;
        });
        document.getElementById('optionalTotal').textContent = 'NT$ ' + optionalTotal.toLocaleString();
        
        const subtotal = standardTotal + optionalTotal;
        const tax = subtotal * 0.05;
        const grandTotal = subtotal + tax;
        
        document.getElementById('subtotalNoTax').textContent = 'NT$ ' + subtotal.toLocaleString();
        document.getElementById('taxAmount').textContent = 'NT$ ' + tax.toLocaleString();
        document.getElementById('grandTotal').textContent = 'NT$ ' + grandTotal.toLocaleString();
        
        return {standardTotal, optionalTotal, subtotal, tax, grandTotal};
    }
    
    function updatePreview() {
        const clientName = document.getElementById('clientName').value || '客戶名稱';
        const eventName = document.getElementById('eventName').value || '主題名稱';
        const quoteDate = document.getElementById('quoteDate').value;
        const validDate = document.getElementById('validDate').value;
        const eventDate = document.getElementById('eventDate').value;
        const location = document.getElementById('location').value || '';
        const totals = calcTotal();
        
        // 格式化日期
        const formatDate = (d) => {
            if(!d) return '';
            const parts = d.split('-');
            return `${parts[0]}年${parts[1]}月${parts[2]}日`;
        };
        
        let html = `<div class="quote-page">`;
        html += `<div class="quote-title">★ 公版 - 樂點創意報價單 - ${formatDate(quoteDate)} - ${clientName} - ${eventName} ★</div>`;
        
        html += `<div class="quote-info">
            <div><strong>客戶名稱：</strong>${clientName}</div>
            <div><strong>報價日期：</strong>${formatDate(quoteDate)}</div>
            <div><strong>活動名稱：</strong>${eventName}</div>
            <div><strong>報價效期：</strong>${formatDate(validDate)}</div>
            <div><strong>活動地點：</strong>${location}</div>
            <div><strong>活動日期：</strong>${formatDate(eventDate)}</div>
        </div>`;
        
        html += `<table class="quote-table">
            <tr><th style="width:30px">項</th><th>內 容</th><th style="width:40px">數量</th><th style="width:40px">單位</th><th style="width:60px">單價</th><th style="width:60px">總價</th></tr>`;
        
        // 標配項目
        let itemNum = 1;
        html += `<tr><td colspan="6" class="section-header">標配項目</td></tr>`;
        document.querySelectorAll('#standardItems .item-row').forEach(row => {
            const name = row.querySelector('input:first-child').value;
            const qty = row.querySelector('.qty').value;
            const unit = row.querySelector('.unit').value;
            const price = parseFloat(row.querySelector('.price').value) || 0;
            const total = qty * price;
            if(name) {
                html += `<tr><td>${itemNum}</td><td>${name}</td><td>${qty}</td><td>${unit}</td><td>${price?price.toLocaleString():''}</td><td>${total?total.toLocaleString():''}</td></tr>`;
                itemNum++;
            }
        });
        
        // 選配項目
        document.querySelectorAll('#optionalCategories').forEach(catDiv => {
            const catTitle = catDiv.querySelector('h4').textContent;
            let hasItems = false;
            let catHtml = `<tr><td colspan="6" class="section-header">選配加購：${catTitle}</td></tr>`;
            catDiv.querySelectorAll('.item-row').forEach(row => {
                const name = row.querySelector('input:first-child').value;
                const qty = parseFloat(row.querySelector('.qty').value) || 0;
                const unit = row.querySelector('.unit').value;
                const price = parseFloat(row.querySelector('.price').value) || 0;
                const total = qty * price;
                if(qty > 0 && name) {
                    catHtml += `<tr><td></td><td>${name}</td><td>${qty}</td><td>${unit}</td><td>${price.toLocaleString()}</td><td>${total.toLocaleString()}</td></tr>`;
                    hasItems = true;
                }
            });
            if(hasItems) html += catHtml;
        });
        
        html += `</table>`;
        
        html += `<div class="quote-total">
            <div class="quote-total-row">合計未稅：${totals.subtotal.toLocaleString()} 元</div>
            <div class="quote-total-row">稅額 (5%)：${totals.tax.toLocaleString()} 元</div>
            <div class="quote-total-row grand-total">總價含稅：${totals.grandTotal.toLocaleString()} 元</div>
        </div>`;
        
        html += `<div style="margin-top:20px;font-size:9px;">
            <h4>客戶確認欄</h4>
            <p>公司名稱：${document.getElementById('companyName').value} | 統一編號：${document.getElementById('taxId').value}</p>
            <p>聯絡人：${document.getElementById('contactPerson').value} | 電話：${document.getElementById('contactPhone').value}</p>
            <p>Email：${document.getElementById('contactEmail').value}</p>
            <h4>匯款資訊</h4>
            <p>戶名：異品科技股份有限公司 | 銀行：808-0185 玉山銀行 桃園分行</p>
            <p>帳號：0185440011887</p>
        </div>`;
        
        html += `</div>`;
        
        document.getElementById('preview-content').innerHTML = html;
    }
    
    async function generatePDF() {
        // 先更新預覽
        updatePreview();
        
        const element = document.getElementById('preview-content').querySelector('.quote-page');
        
        // 使用 html2canvas 轉換為圖片
        const canvas = await html2canvas(element, {
            scale: 2,
            useCORS: true,
            logging: false,
            backgroundColor: '#ffffff'
        });
        
        const imgData = canvas.toDataURL('image/png');
        
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        
        const imgWidth = 210;
        const imgHeight = (canvas.height * imgWidth) / canvas.width;
        
        pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight);
        
        const clientName = document.getElementById('clientName').value || '客戶';
        const eventName = document.getElementById('eventName').value || '主題';
        const fileName = `報價單_${clientName}_${eventName}.pdf`;
        
        pdf.save(fileName);
        
        alert('PDF 已產生：' + fileName);
