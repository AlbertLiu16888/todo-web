<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 樂點創意報價單系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #6366f1; --secondary: #8b5cf6; }
        body { font-family: 'Microsoft JhengHei', 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); min-height: 100vh; color: #fff; }
        .header { background: linear-gradient(135deg, var(--primary), var(--secondary)); padding: 20px; text-align: center; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .card { background: rgba(255,255,255,0.08); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .card h3 { color: #a78bfa; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-bottom: 15px; }
        .form-label { color: #a78bfa; font-weight: 500; }
        .form-control, .form-select { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; }
        .form-control:focus, .form-select:focus { background: rgba(255,255,255,0.15); border-color: var(--primary); color: #fff; }
        .form-control::placeholder { color: rgba(255,255,255,0.4); }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); border: none; }
        .btn-success { background: #10b981; border: none; }
        .btn-info { background: #06b6d4; border: none; }
        .item-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .item-row input { flex: 1; }
        .item-row .qty { width: 80px; }
        .item-row .price { width: 120px; }
        .item-row .del-btn { background: #ef4444; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
        #preview { background: #fff; color: #000; padding: 40px; min-height: 800px; display: none; }
        .nav-tabs { border-bottom: 1px solid rgba(255,255,255,0.2); }
        .nav-tabs .nav-link { color: rgba(255,255,255,0.7); border: none; }
        .nav-tabs .nav-link.active { background: transparent; color: #fff; border-bottom: 2px solid var(--primary); }
        .total-section { background: rgba(99,102,241,0.2); padding: 15px; border-radius: 8px; margin-top: 20px; }
        .total-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 1.1rem; }
        .grand-total { font-size: 1.3rem; font-weight: bold; color: #22c55e; border-top: 2px solid rgba(255,255,255,0.3); padding-top: 10px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📝 樂點創意報價單系統</h1>
        <p>快速產製專業報價單 | 支援 Email 及 LINE 發送</p>
    </div>
    <div class="container">
        <ul class="nav nav-tabs mb-3">
            <li class="nav-item"><a class="nav-link active" href="#basic" data-bs-toggle="tab">基本資料</a></li>
            <li class="nav-item"><a class="nav-link" href="#standard" data-bs-toggle="tab">標配項目</a></li>
            <li class="nav-item"><a class="nav-link" href="#optional" data-bs-toggle="tab">選配加購</a></li>
            <li class="nav-item"><a class="nav-link" href="#preview-tab" data-bs-toggle="tab">預覽產出</a></li>
        </ul>
        <div class="tab-content">
            <!-- 基本資料 -->
            <div class="tab-pane fade show active" id="basic">
                <div class="card">
                    <h3>📋 基本資訊</h3>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">客戶名稱 *</label>
                            <input type="text" class="form-control" id="clientName" placeholder="輸入客戶名稱">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">活動名稱/主題 *</label>
                            <input type="text" class="form-control" id="eventName" placeholder="例如：謎走大富翁">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">報價日期</label>
                            <input type="date" class="form-control" id="quoteDate">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">報價效期</label>
                            <input type="date" class="form-control" id="validDate">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">活動日期</label>
                            <input type="date" class="form-control" id="eventDate">
                        </div>
                        <div class="col-md-12 mb-3">
                            <label class="form-label">活動地點</label>
                            <input type="text" class="form-control" id="location" placeholder="輸入活動地點">
                        </div>
                    </div>
                </div>
                <div class="card">
                    <h3>👤 客戶確認欄</h3>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">公司名稱</label>
                            <input type="text" class="form-control" id="companyName" value="異品科技股份有限公司">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">統一編號</label>
                            <input type="text" class="form-control" id="taxId" value="16356300">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">聯絡人</label>
                            <input type="text" class="form-control" id="contactPerson" placeholder="輸入聯絡人姓名">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">電話</label>
                            <input type="tel" class="form-control" id="contactPhone" placeholder="輸入電話">
                        </div>
                        <div class="col-md-12 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="contactEmail" placeholder="輸入 Email">
                        </div>
                    </div>
                </div>
                <button class="btn btn-primary btn-lg" onclick="goToTab('standard')">下一步：標配項目 →</button>
            </div>
            <!-- 標配項目 -->
            <div class="tab-pane fade" id="standard">
                <div class="card">
                    <h3>✅ 標配項目</h3>
                    <div id="standardItems">
                        <div class="item-row">
                            <input type="text" class="form-control" placeholder="項目名稱" value="專案活動籌辦費">
                            <input type="number" class="form-control qty" placeholder="數量" value="1">
                            <input type="text" class="form-control" placeholder="單位" value="式">
                            <input type="number" class="form-control price" placeholder="單價" value="35000" onchange="calcTotal()">
                            <button class="del-btn" onclick="this.parentElement.remove();calcTotal()">✕</button>
                        </div>
                        <div class="item-row">
                            <input type="text" class="form-control" placeholder="項目名稱" value="事前會議">
                            <input type="number" class="form-control qty" placeholder="數量" value="1">
                            <input type="text" class="form-control" placeholder="單位" value="式">
                            <input type="number" class="form-control price" placeholder="單價" value="0" onchange="calcTotal()">
                            <button class="del-btn" onclick="this.parentElement.remove();calcTotal()">✕</button>
                        </div>
                        <div class="item-row">
                            <input type="text" class="form-control" placeholder="項目名稱" value="任務關卡設計">
                            <input type="number" class="form-control qty" placeholder="數量" value="1">
                            <input type="text" class="form-control" placeholder="單位" value="式">
                            <input type="number" class="form-control price" placeholder="單價" value="0" onchange="calcTotal()">
                            <button class="del-btn" onclick="this.parentElement.remove();calcTotal()">✕</button>
                        </div>
                        <div class="item-row">
                            <input type="text" class="form-control" placeholder="項目名稱" value="活動場地佈置">
                            <input type="number" class="form-control qty" placeholder="數量" value="1">
                            <input type="text" class="form-control" placeholder="單位" value="式">
                            <input type="number" class="form-control price" placeholder="單價" value="0" onchange="calcTotal()">
                            <button class="del-btn" onclick="this.parentElement.remove();calcTotal()">✕</button>
                        </div>
                    </div>
                    <button class="btn btn-secondary mt-2" onclick="addItem('standardItems')">+ 新增項目</button>
                </div>
                <div class="total-section">
                    <div class="total-row"><span>標配小計：</span><span id="standardTotal">NT$ 35,000</span></div>
                </div>
                <div class="d-flex gap-2 mt-3">
                    <button class="btn btn-secondary" onclick="goToTab('basic')">← 上一步</button>
                    <button class="btn btn-primary" onclick="goToTab('optional')">下一步：選配加購 →</button>
                </div>
            </div>
            <!-- 選配加購 -->
            <div class="tab-pane fade" id="optional">
                <div class="card">
                    <h3>🎯 選配加購</h3>
                    <div class="mb-3">
                        <label class="form-label">加購類別</label>
                        <select class="form-select" id="optionalCategory" onchange="addOptionalItem()">
                            <option value="">-- 選擇類別 --</option>
                            <option value="其他任務設計">其他任務設計</option>
                            <option value="影像製作">影像製作</option>
                            <option value="視覺設計輸出">視覺設計輸出</option>
                            <option value="硬體設備">硬體設備</option>
                            <option value="其他">其他</option>
                            <option value="場地/餐飲/住宿">場地/餐飲/住宿</option>
                        </select>
                    </div>
                    <div id="optionalItems"></div>
                </div>
                <div class="total-section">
                    <div class="total-row"><span>標配小計：</span><span id="optStandardTotal">NT$ 35,000</span></div>
                    <div class="total-row"><span>選配小計：</span><span id="optionalTotal">NT$ 0</span></div>
                    <div class="total-row"><span>合計未稅：</span><span id="subtotalNoTax">NT$ 35,000</span></div>
                    <div class="total-row"><span>稅額 (5%)：</span><span id="taxAmount">NT$ 1,750</span></div>
                    <div class="total-row grand-total"><span>總價含稅：</span><span id="grandTotal">NT$ 36,750</span></div>
                </div>
                <div class="d-flex gap-2 mt-3">
                    <button class="btn btn-secondary" onclick="goToTab('standard')">← 上一步</button>
                    <button class="btn btn-success" onclick="generatePDF()">📄 產生 PDF</button>
                    <button class="btn btn-info" onclick="showSendOptions()">📤 發送選項</button>
                </div>
            </div>
            <!-- 預覽 -->
            <div class="tab-pane fade" id="preview-tab">
                <div class="card">
                    <h3>📄 預覽報價單</h3>
                    <div id="preview"></div>
                </div>
            </div>
        </div>
        <!-- 發送選項 Modal -->
        <div class="modal" id="sendModal">
            <div class="modal-content" style="background:#1e293b;padding:25px;border-radius:16px;max-width:400px;">
                <h4>📤 發送報價單</h4>
                <div class="mb-3">
                    <label class="form-label">客戶 Email</label>
                    <input type="email" class="form-control" id="sendEmail" placeholder="輸入客戶 Email">
                </div>
                <button class="btn btn-primary w-100 mb-2" onclick="sendViaEmail()">📧 發送 Email</button>
                <button class="btn btn-success w-100 mb-2" onclick="sendToLINE()">💬 發送到 LINE</button>
                <button class="btn btn-secondary w-100" onclick="document.getElementById('sendModal').style.display='none'">取消</button>
            </div>
        </div>
    </div>
    <script>
    // 初始化日期
    document.getElementById('quoteDate').valueAsDate = new Date();
    const validDate = new Date();
    validDate.setDate(validDate.getDate() + 14);
    document.getElementById('validDate').valueAsDate = validDate;
    
    function goToTab(tabId) {
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        document.querySelector(`[href="#${tabId}"]`).classList.add('active');
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('show', 'active'));
        document.getElementById(tabId).classList.add('show', 'active');
        if(tabId === 'optional') calcTotal();
    }
    
    function addItem(containerId) {
        const container = document.getElementById(containerId);
        const div = document.createElement('div');
        div.className = 'item-row';
        div.innerHTML = '<input type="text" class="form-control" placeholder="項目名稱"><input type="number" class="form-control qty" placeholder="數量" value="1"><input type="text" class="form-control" placeholder="單位" value="式"><input type="number" class="form-control price" placeholder="單價" value="0" onchange="calcTotal()"><button class="del-btn" onclick="this.parentElement.remove();calcTotal()">✕</button>';
        container.appendChild(div);
    }
    
    function addOptionalItem() {
        const cat = document.getElementById('optionalCategory').value;
        if(!cat) return;
        const container = document.getElementById('optionalItems');
        const div = document.createElement('div');
        div.className = 'item-row';
        div.innerHTML = `<span style="width:150px;color:#a78bfa">${cat}</span><input type="text" class="form-control" placeholder="項目名稱"><input type="number" class="form-control qty" placeholder="數量" value="0"><input type="text" class="form-control" placeholder="單位"><input type="number" class="form-control price" placeholder="單價" value="0" onchange="calcTotal()"><button class="del-btn" onclick="this.parentElement.remove();calcTotal()">✕</button>`;
        container.appendChild(div);
        document.getElementById('optionalCategory').value = '';
    }
    
    function calcTotal() {
        let standardTotal = 0;
        document.querySelectorAll('#standardItems .item-row').forEach(row => {
            const qty = parseFloat(row.querySelector('.qty').value) || 0;
            const price = parseFloat(row.querySelector('.price').value) || 0;
            standardTotal += qty * price;
        });
        document.getElementById('standardTotal').textContent = 'NT$ ' + standardTotal.toLocaleString();
        document.getElementById('optStandardTotal').textContent = 'NT$ ' + standardTotal.toLocaleString();
        
        let optionalTotal = 0;
        document.querySelectorAll('#optionalItems .item-row').forEach(row => {
            const qty = parseFloat(row.querySelector('.qty').value) || 0;
            const price = parseFloat(row.querySelector('.price').value) || 0;
            optionalTotal += qty * price;
        });
        document.getElementById('optionalTotal').textContent = 'NT$ ' + optionalTotal.toLocaleString();
        
        const subtotal = standardTotal + optionalTotal;
        const tax = subtotal * 0.05;
        const grandTotal = subtotal + tax;
        
        document.getElementById('subtotalNoTax').textContent = 'NT$ ' + subtotal.toLocaleString();
        document.getElementById('taxAmount').textContent = 'NT$ ' + tax.toLocaleString();
        document.getElementById('grandTotal').textContent = 'NT$ ' + grandTotal.toLocaleString();
        
        return {standardTotal, optionalTotal, subtotal, tax, grandTotal};
    }
    
    function generatePDF() {
        const {jsPDF} = window.jspdf;
        const doc = new jsPDF();
        const totals = calcTotal();
        
        // 標題
        doc.setFontSize(18);
        doc.text('樂點創意企業活動專案報價單', 105, 20, {align: 'center'});
        
        doc.setFontSize(12);
        doc.text('客戶名稱：' + document.getElementById('clientName').value, 20, 35);
        doc.text('報價日期：' + document.getElementById('quoteDate').value, 120, 35);
        doc.text('活動名稱：' + document.getElementById('eventName').value, 20, 45);
        doc.text('報價效期：' + document.getElementById('validDate').value, 120, 45);
        doc.text('活動地點：' + document.getElementById('location').value, 20, 55);
        doc.text('活動日期：' + document.getElementById('eventDate').value, 120, 55);
        
        // 標配項目
        doc.setFontSize(14);
        doc.text('標配項目', 20, 70);
        doc.line(20, 72, 190, 72);
        
        let y = 80;
        doc.setFontSize(10);
        doc.text('項目', 20, y);
        doc.text('數量', 110, y);
        doc.text('單位', 135, y);
        doc.text('單價', 155, y);
        doc.text('總價', 180, y);
        y += 8;
        
        document.querySelectorAll('#standardItems .item-row').forEach(row => {
            const name = row.querySelector('input:first-child').value;
            const qty = row.querySelector('.qty').value;
            const unit = row.querySelector('input:nth-child(3)').value;
            const price = row.querySelector('.price').value;
            const total = (parseFloat(qty) || 0) * (parseFloat(price) || 0);
            doc.text(name.substring(0, 35), 20, y);
            doc.text(qty, 110, y);
            doc.text(unit, 135, y);
            doc.text(parseInt(price).toLocaleString(), 155, y);
            doc.text(total.toLocaleString(), 180, y);
            y += 7;
        });
        
        // 選配項目
        y += 10;
        doc.setFontSize(14);
        doc.text('選配加購', 20, y);
        doc.line(20, y+2, 190, y+2);
        y += 10;
        
        doc.setFontSize(10);
        document.querySelectorAll('#optionalItems .item-row').forEach(row => {
            const name = row.querySelector('input:nth-child(2)').value;
            const qty = row.querySelector('.qty').value;
            const unit = row.querySelector('input:nth-child(3)').value;
            const price = row.querySelector('.price').value;
            const total = (parseFloat(qty) || 0) * (parseFloat(price) || 0);
            if(name) {
                doc.text(name.substring(0, 35), 20, y);
                doc.text(qty, 110, y);
                doc.text(unit, 135, y);
                doc.text(parseInt(price).toLocaleString(), 155, y);
                doc.text(total.toLocaleString(), 180, y);
                y += 7;
            }
        });
        
        // 總計
        y += 10;
        doc.text('合計未稅：' + totals.subtotal.toLocaleString() + ' 元', 140, y);
        y += 7;
        doc.text('稅額 (5%)：' + totals.tax.toLocaleString() + ' 元', 140, y);
        y += 7;
        doc.setFontSize(12);
        doc.text('總價含稅：' + totals.grandTotal.toLocaleString() + ' 元', 140, y);
        
        // 客戶確認欄
        y += 20;
        doc.setFontSize(12);
        doc.text('客戶確認欄', 20, y);
        doc.line(20, y+2, 190, y+2);
        y += 10;
        doc.setFontSize(10);
        doc.text('公司名稱：' + document.getElementById('companyName').value, 20, y);
        doc.text('統一編號：' + document.getElementById('taxId').value, 120, y);
        y += 7;
        doc.text('聯絡人：' + document.getElementById('contactPerson').value, 20, y);
        doc.text('電話：' + document.getElementById('contactPhone').value, 120, y);
        y += 7;
        doc.text('Email：' + document.getElementById('contactEmail').value, 20, y);
        
        // 儲存
        const fileName = '報價單_' + document.getElementById('clientName').value + '_' + document.getElementById('eventName').value + '.pdf';
        doc.save(fileName);
        
        alert('PDF 已產生：' + fileName);
    }
    
    function showSendOptions() {
        document.getElementById('sendModal').style.display = 'flex';
    }
    
    function sendViaEmail() {
        const email = document.getElementById('sendEmail').value;
        if(!email) { alert('請輸入 Email'); return; }
        alert('Email 發送功能需要設定 SMTP，請先產生 PDF 後手動發送！\n\nEmail: ' + email);
    }
    
    function sendToLINE() {
        alert('LINE 發送功能需要 LINE Bot API 設定，請先產生 PDF！');
    }
    
    calcTotal();
    </script>
</body>
</html>
