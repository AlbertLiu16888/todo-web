<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 樂點創意報價單系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        :root {
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --bg-dark: #0f172a;
            --bg-card: rgba(255,255,255,0.08);
            --text-muted: rgba(255,255,255,0.65);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, var(--bg-dark) 100%);
            min-height: 100vh;
            color: #fff;
        }
        .header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 24px 12px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
        }
        .header h1 { margin: 0; font-size: 2.2rem; font-weight: 700; }
        .container-custom { max-width: 1220px; margin: 0 auto; padding: 24px 16px 80px; }
        .card-custom {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 18px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .card-custom h3 {
            font-size: 1.15rem;
            font-weight: 600;
            color: #c4b5fd;
            margin-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 6px;
        }
        .form-control, .form-select, textarea {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
        }
        .form-control:focus, .form-select:focus { border-color: var(--primary); box-shadow: none; }
        .nav-tabs .nav-link { color: var(--text-muted); border: none; }
        .nav-tabs .nav-link.active { color: #fff; border-bottom: 2px solid var(--primary); background: transparent; }
        .item-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            padding: 10px;
        }
        .item-row input { flex: 1; min-width: 120px; }
        .item-row .qty { width: 80px; }
        .item-row .unit { width: 70px; }
        .item-row .price { width: 110px; }
        .del-btn {
            background: #ef4444;
            border: none;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
        }
        .total-section {
            background: rgba(99,102,241,0.2);
            border-radius: 14px;
            padding: 16px;
            margin-top: 12px;
        }
        .total-row { display: flex; justify-content: space-between; padding: 4px 0; }
        .total-row span:last-child { font-weight: 600; }
        .grand-total { font-size: 1.35rem; color: #4ade80; border-top: 1px solid rgba(255,255,255,0.15); margin-top: 8px; padding-top: 8px; }
        .settings-note { font-size: 0.9rem; color: var(--text-muted); }
        /* Preview */
        #preview-content { background: #fff; color: #000; border-radius: 12px; padding: 0; }
        .preview-actions { gap: 10px; flex-wrap: wrap; }
        .preview-actions button { flex: 1; min-width: 180px; }
        .action-log { background: rgba(0,0,0,0.25); border-radius: 12px; padding: 12px; max-height: 220px; overflow: auto; font-size: 0.9rem; }
        .action-log .log-entry { border-bottom: 1px solid rgba(255,255,255,0.07); padding: 6px 0; }
        .action-log .log-entry:last-child { border-bottom: none; }
        .log-entry span { display: inline-block; min-width: 60px; font-size: 0.8rem; color: #a5b4fc; }
        .cloud-links a { display: block; word-break: break-all; color: #38bdf8; }
        /* Quote preview page */
        .quote-page { font-family: 'Noto Sans TC', sans-serif; padding: 25px 30px; font-size: 12px; }
        .quote-title { text-align: center; font-size: 18px; font-weight: 700; border-bottom: 2px solid #111; padding-bottom: 8px; margin-bottom: 10px; }
        .quote-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 6px 18px; margin-bottom: 12px; }
        .quote-info div { font-size: 12px; }
        .quote-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
        .quote-table th, .quote-table td { border: 1px solid #ccc; padding: 5px 6px; vertical-align: top; }
        .quote-table th { background: #f3f4f6; }
        .section-header { background: #f8fafc; font-weight: 600; font-size: 12px; }
        .quote-total { text-align: right; margin-top: 6px; font-size: 12px; }
        .quote-total div { margin: 2px 0; }
        .quote-notes h4 { font-size: 12px; margin-top: 16px; }
        .quote-notes li { font-size: 11px; margin-bottom: 4px; line-height: 1.4; }
        .quote-footer { margin-top: 12px; font-size: 11px; }
        .quote-footer p { margin: 2px 0; }
        .page-break { page-break-after: always; }
        textarea#prefillInput { min-height: 140px; }
        .instructions { font-size: 0.9rem; color: var(--text-muted); }
        .btn-gradient { background: linear-gradient(135deg, var(--primary), var(--secondary)); border: none; }
        .btn-line { background: #00b900; color: #fff; }
        .btn-drive { background: #4285f4; color: #fff; }
        .btn-mail { background: #f97316; color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.15); border: none; }
        @media (max-width: 768px) {
            .preview-actions button { min-width: 100%; }
            .item-row { flex-direction: column; }
            .item-row input, .item-row .qty, .item-row .unit, .item-row .price { width: 100%; }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>📝 樂點創意報價單系統</h1>
        <p>資料預填 · 專業輸出 · 一鍵寄送</p>
    </header>
    <div class="container-custom">
        <ul class="nav nav-tabs mb-3" role="tablist">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-basic" type="button">基本資訊</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-standard" type="button">標配項目</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-optional" type="button">選配加購</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-preview" type="button">預覽 / 產出</button></li>
        </ul>
        <div class="tab-content">
            <!-- Basic -->
            <div class="tab-pane fade show active" id="tab-basic">
                <div class="card-custom">
                    <h3>📋 基本資料</h3>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">客戶名稱 *</label>
                            <input type="text" class="form-control" id="clientName" placeholder="輸入客戶名稱">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">活動名稱/主題 *</label>
                            <input type="text" class="form-control" id="eventName" list="eventTemplates" placeholder="例如：謎走大富翁">
                            <datalist id="eventTemplates">
                                <option value="謎走大富翁"></option>
                                <option value="福爾摩斯"></option>
                                <option value="一起玩魷戲"></option>
                                <option value="體能之巔"></option>
                                <option value="樂園奇遇記"></option>
                                <option value="Running Fighter"></option>
                                <option value="動物方城市"></option>
                                <option value="破風奪寶令"></option>
                                <option value="鐵道嬉遊記"></option>
                                <option value="無痕世代"></option>
                                <option value="骨牌拼圖趣"></option>
                                <option value="麥克金頭腦"></option>
                                <option value="客製任務包"></option>
                                <option value="兩天一夜活動"></option>
                                <option value="家庭日"></option>
                                <option value="尾牙春酒"></option>
                            </datalist>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">報價日期</label>
                            <input type="date" class="form-control" id="quoteDate">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">報價效期</label>
                            <input type="date" class="form-control" id="validDate">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">活動日期</label>
                            <input type="date" class="form-control" id="eventDate">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">活動地點</label>
                            <input type="text" class="form-control" id="location" placeholder="輸入活動地點">
                        </div>
                    </div>
                </div>
                <div class="card-custom">
                    <h3>👤 客戶確認欄</h3>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">公司名稱</label>
                            <input type="text" class="form-control" id="companyName" value="異品科技股份有限公司">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">統一編號</label>
                            <input type="text" class="form-control" id="taxId" value="16356300">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">聯絡人</label>
                            <input type="text" class="form-control" id="contactPerson" value="何欣樺 Joann Ho">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">電話</label>
                            <input type="tel" class="form-control" id="contactPhone" value="0988-956-606">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="contactEmail" value="service@funideas.com.tw">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">地址</label>
                            <input type="text" class="form-control" id="contactAddress" value="桃園市中壢區永能路23巷2號">
                        </div>
                    </div>
                </div>
                <div class="card-custom">
                    <h3>⚡️ 資料預填</h3>
                    <p class="instructions">貼上表單文字（格式：以「＊欄位：內容」開頭，直到下一個「＊」為止），系統會自動解析客戶資訊。</p>
                    <textarea id="prefillInput" class="form-control" placeholder="＊客戶名稱：台積電
＊活動日期：2026/05/15
＊客戶窗口：..."></textarea>
                    <div class="text-end mt-3">
                        <button class="btn btn-gradient" onclick="parsePrefillText()">解析並填入</button>
                    </div>
                </div>
                <div class="card-custom">
                    <h3>🛠 系統設定</h3>
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label">LINE Channel Access Token</label>
                            <input type="password" class="form-control" id="lineTokenInput" placeholder="輸入 LINE Messaging API token">
                            <div class="settings-note">僅存於本機瀏覽器 localStorage。</div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Drive Folder ID (選填)</label>
                            <input type="text" class="form-control" id="driveFolderInput" placeholder="預設使用根目錄">
                        </div>
                    </div>
                    <div class="d-flex justify-content-end gap-2 mt-3">
                        <span id="settingsStatus" class="settings-note align-self-center"></span>
                        <button class="btn btn-secondary" onclick="clearSettings()">清除設定</button>
                        <button class="btn btn-gradient" onclick="saveSettings()">儲存設定</button>
                    </div>
                </div>
            </div>
            <!-- Standard -->
            <div class="tab-pane fade" id="tab-standard">
                <div class="card-custom">
                    <h3>✅ 標配項目</h3>
                    <div id="standardItems"></div>
                    <button class="btn btn-secondary mt-2" onclick="addStandardItem()">+ 新增項目</button>
                    <div class="total-section">
                        <div class="total-row"><span>標配小計：</span><span id="standardTotal">NT$ 0</span></div>
                    </div>
                </div>
            </div>
            <!-- Optional -->
            <div class="tab-pane fade" id="tab-optional">
                <div class="card-custom">
                    <h3>🎯 選配加購</h3>
                    <label class="form-label">選擇套用的類別</label>
                    <select class="form-select mb-3" id="optionalCategory" onchange="addOptionalCategory()">
                        <option value="">-- 選擇類別 --</option>
                        <option value="其他任務設計">其他任務設計</option>
                        <option value="影像製作">影像製作</option>
                        <option value="視覺設計輸出">視覺設計輸出</option>
                        <option value="硬體設備">硬體設備</option>
                        <option value="其他">其他</option>
                        <option value="場地/餐飲/住宿">場地/餐飲/住宿</option>
                    </select>
                    <div id="optionalCategories"></div>
                    <div class="total-section">
                        <div class="total-row"><span>標配小計：</span><span id="optStandardTotal">NT$ 0</span></div>
                        <div class="total-row"><span>選配小計：</span><span id="optionalTotal">NT$ 0</span></div>
                        <div class="total-row"><span>合計未稅：</span><span id="subtotalNoTax">NT$ 0</span></div>
                        <div class="total-row"><span>稅額 (5%)：</span><span id="taxAmount">NT$ 0</span></div>
                        <div class="total-row grand-total"><span>總價含稅：</span><span id="grandTotal">NT$ 0</span></div>
                    </div>
                </div>
            </div>
            <!-- Preview -->
            <div class="tab-pane fade" id="tab-preview">
                <div class="card-custom">
                    <h3>📄 報價單預覽 / 產出</h3>
                    <div class="d-flex preview-actions mb-3">
                        <button class="btn btn-gradient" id="btnUpdatePreview" onclick="updatePreview(true)">🔄 更新預覽</button>
                        <button class="btn btn-secondary" id="btnPdf" onclick="downloadPdf()">📄 下載 PDF</button>
                        <button class="btn btn-secondary" id="btnExcel" onclick="downloadExcel()">📊 下載 Excel</button>
                        <button class="btn btn-drive" id="btnDrive" onclick="handleDriveUpload()">☁️ 上傳雲端</button>
                        <button class="btn btn-mail" id="btnEmail" onclick="sendQuoteEmail()">✉️ 寄送 Email</button>
                        <button class="btn btn-line" id="btnLine" onclick="shareToLine()">💬 分享 LINE</button>
                    </div>
                    <div class="cloud-links mb-3" id="cloud-links"></div>
                    <div id="preview-content"></div>
                    <div id="preview-print" style="position:absolute; left:-9999px; top:-9999px;"></div>
                    <div class="mt-3">
                        <h5>動作紀錄</h5>
                        <div class="action-log" id="action-log"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    const defaultStandardItems = [

    const optionalCategories = {

        '活動整體專案費依需求估算（人數彈性調整，增減將另行報價）。',

    let tokenClient = null;
    let googleAccessToken = null;
    let googleTokenExpiry = 0;
    let gapiReady = false;
    let currentQuoteData = null;
    let currentPdfBlob = null;
    let currentExcelBlob = null;

        document.getElementById('quoteDate').valueAsDate = new Date();
        const v = new Date();
        v.setDate(v.getDate() + 14);
        document.getElementById('validDate').valueAsDate = v;

    function calcTotal() {
        let standard = 0;
        document.querySelectorAll('#standardItems .item-row').forEach(row => {

            const price = parseFloat(row.querySelector('.price').value) || 0;
            standard += qty * price;
        });
        document.getElementById('standardTotal').textContent = formatCurrency(standard);
        document.getElementById('optStandardTotal').textContent = formatCurrency(standard);
        let optional = 0;
        document.querySelectorAll('#optionalCategories .item-row').forEach(row => {
            const qty = parseFloat(row.querySelector('.qty').value) || 0;
            const price = parseFloat(row.querySelector('.price').value) || 0;
            optional += qty * price;
        });
        document.getElementById('optionalTotal').textContent = formatCurrency(optional);
        const subtotal = standard + optional;
        const tax = subtotal * 0.05;
        document.getElementById('subtotalNoTax').textContent = formatCurrency(subtotal);
        document.getElementById('taxAmount').textContent = formatCurrency(tax);
        document.getElementById('grandTotal').textContent = formatCurrency(subtotal + tax);
        return {standard, optional, subtotal, tax, grand: subtotal + tax};
    }

    function parsePrefillText() {
        const raw = document.getElementById('prefillInput').value;
        if(!raw.trim()) {
            alert('請貼上要解析的文字內容。');
            return;
        }
        const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        const blocks = [];
        let current = null;
        lines.forEach(line => {
            if(line.startsWith('＊')) {
                if(current) blocks.push(current);
                const content = line.replace(/^＊/, '');
                const [key, ...rest] = content.split('：');
                current = { key: key.trim(), value: rest.join('：').trim() };
            } else if(current) {
                current.value += ' ' + line;
            }
        });
        if(current) blocks.push(current);
        const map = {};
        blocks.forEach(({key, value}) => {
            map[key] = value.trim();
        });
        applyPrefillMap(map);
        logStatus('已套用預填資料。');
    }

    function applyPrefillMap(map) {
        if(map['客戶名稱']) {
            document.getElementById('clientName').value = map['客戶名稱'];
            document.getElementById('companyName').value = map['客戶名稱'];
        }
        if(map['活動名稱']) document.getElementById('eventName').value = map['活動名稱'];
        if(map['活動地點']) document.getElementById('location').value = map['活動地點'];
        if(map['活動日期']) {
            const parsed = normalizeDate(map['活動日期']);
            if(parsed) document.getElementById('eventDate').value = parsed;
        }
        if(map['報價日期']) {
            const q = normalizeDate(map['報價日期']);
            if(q) document.getElementById('quoteDate').value = q;
        }
        if(map['報價效期']) {
            const v = normalizeDate(map['報價效期']);
            if(v) document.getElementById('validDate').value = v;
        }
        if(map['公司名稱']) document.getElementById('companyName').value = map['公司名稱'];
        if(map['統一編號']) document.getElementById('taxId').value = map['統一編號'];
        if(map['電話']) document.getElementById('contactPhone').value = extractPhone(map['電話']);
        if(map['地址']) document.getElementById('contactAddress').value = map['地址'];
        if(map['客戶窗口']) applyContactString(map['客戶窗口']);
        if(map['聯絡人']) applyContactString(map['聯絡人']);
    }

    function applyContactString(text) {
        const email = extractEmail(text);
        const phone = extractPhone(text);
        if(email) document.getElementById('contactEmail').value = email;
        if(phone) document.getElementById('contactPhone').value = phone;
        const name = text.replace(email || '', '').replace(phone || '', '').replace(/[\/]/g, ' ').trim();
        if(name) document.getElementById('contactPerson').value = name;
    }

    function extractEmail(text) {
        const match = text.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i);
        return match ? match[0] : '';
    }

    function extractPhone(text) {
        const match = text.match(/09\d{8}/);
        return match ? match[0] : '';
    }

    function normalizeDate(text) {
        if(!text) return '';
        const full = text.match(/(\d{4})[\/年-](\d{1,2})[\/月-](\d{1,2})/);
        if(full) {
            return `${full[1]}-${full[2].padStart(2,'0')}-${full[3].padStart(2,'0')}`;
        }
        const partial = text.match(/(\d{1,2})[\/月](\d{1,2})/);
        if(partial) {
            const year = new Date().getFullYear();
            return `${year}-${partial[1].padStart(2,'0')}-${partial[2].padStart(2,'0')}`;
        }
        return '';
    }

    async function generatePdfBlob() {
        await ensureQuoteData();
        const element = document.querySelector('#preview-print .quote-page');
        const canvas = await html2canvas(element, { scale: 2, backgroundColor: '#ffffff' });
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const pageWidth = 210;
        const pageHeight = 297;
        const imgHeight = (canvas.height * pageWidth) / canvas.width;
        let heightLeft = imgHeight;
        let position = 0;
        pdf.addImage(imgData, 'PNG', 0, position, pageWidth, imgHeight);
        heightLeft -= pageHeight;
        while (heightLeft > 0) {
            position = heightLeft - imgHeight;
            pdf.addPage();
            pdf.addImage(imgData, 'PNG', 0, position, pageWidth, imgHeight);
            heightLeft -= pageHeight;
        }
        return pdf.output('blob');
    }

    function gapiLoaded() {
        gapi.load('client', async () => {
            await gapi.client.init({
                discoveryDocs: [
                    'https://www.googleapis.com/discovery/v1/apis/gmail/v1/rest',

                ]

    function gisLoaded() {
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: GOOGLE_CLIENT_ID,
            scope: GOOGLE_SCOPES,
            callback: (resp) => {
                if(resp.error) {
                    logStatus('Google 授權失敗：' + resp.error, 'error');
                    return;
                }
                googleAccessToken = resp.access_token;
                googleTokenExpiry = Date.now() + (resp.expires_in - 60) * 1000;
                gapi.client.setToken({ access_token: googleAccessToken });
                logStatus('已取得 Google 權杖。');
                if(pendingTokenResolve) pendingTokenResolve(googleAccessToken);
                pendingTokenResolve = null;
            }
        });
    }

    let pendingTokenResolve = null;
    function ensureGoogleToken() {
        return new Promise((resolve, reject) => {
            if(!gapiReady || !tokenClient) {
                reject(new Error('Google API 尚未就緒')); return;
            }
            if(googleAccessToken && Date.now() < googleTokenExpiry) {
                resolve(googleAccessToken);
                return;
            }
            pendingTokenResolve = resolve;
            try {
                tokenClient.requestAccessToken({ prompt: googleAccessToken ? '' : 'consent' });
            } catch (err) {
                pendingTokenResolve = null;
                reject(err);
            }
        });
    }

        const parentId = document.getElementById('driveFolderInput').value.trim();
        const metadata = {
            name: `報價單_${data.clientName}_${data.eventName}_${data.quoteDate || ''}`,
            mimeType: 'application/vnd.google-apps.folder'
        };
        if(parentId) metadata.parents = [parentId];
        const response = await gapi.client.drive.files.create({ resource: metadata, fields: 'id' });
        return response.result.id;
    }

    async function uploadDriveFile(folderId, blob, mimeType) {
        const data = await ensureQuoteData();
        const fileName = `報價單_${data.clientName}_${data.eventName}.${mimeType.includes('pdf') ? 'pdf' : 'xlsx'}`;
        const form = new FormData();
        form.append('metadata', new Blob([JSON.stringify({ name: fileName, parents: [folderId] })], { type: 'application/json' }));
        form.append('file', blob);
        const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + googleAccessToken },
            body: form
        });
        const result = await response.json();
        return result.id;
    }

    async function makeFilePublic(fileId) {
        await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}/permissions`, {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + googleAccessToken,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ role: 'reader', type: 'anyone' })
        });
    }

    async function sendQuoteEmail() {
        try {
            setLoading('btnEmail', true);
            const data = await ensureQuoteData();
            if(!currentPdfBlob) currentPdfBlob = await generatePdfBlob();
            if(!currentExcelBlob) currentExcelBlob = await generateExcelBlob();
            await ensureGoogleToken();
            const pdfBase64 = await blobToBase64(currentPdfBlob);
            const xlsxBase64 = await blobToBase64(currentExcelBlob);
            const boundary = 'boundary_' + Date.now();
            const bodyText = `您好，附上 ${data.eventName} 報價單，含稅總價 ${formatCurrency(data.totals.grand)}。`; 
            const driveLinkText = lastUploadLinks ? `雲端連結：${lastUploadLinks.folderLink}` : '';
            const recipient = data.contactEmail || 'service@funideas.com.tw';
            const subject = `樂點創意報價單 - ${data.clientName} - ${data.eventName}`;
            const mime = [
                `To: ${recipient}`,
                `Subject: ${subject}`,
                `MIME-Version: 1.0`,
                `Content-Type: multipart/mixed; boundary=${boundary}`,
                '',
                `--${boundary}`,
                'Content-Type: text/plain; charset=utf-8',
                '',
                `${bodyText}\n${driveLinkText}`,
                `--${boundary}`,
                'Content-Type: application/pdf',
                `Content-Disposition: attachment; filename=quote.pdf`,
                'Content-Transfer-Encoding: base64',
                '',
                pdfBase64,
                `--${boundary}`,
                'Content-Type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
                `Content-Disposition: attachment; filename=quote.xlsx`,
                'Content-Transfer-Encoding: base64',
                '',
                xlsxBase64,
                `--${boundary}--`
            ].join('\r\n');
            const raw = btoa(unescape(encodeURIComponent(mime))).replace(/\+/g,'-').replace(/\//g,'_');
            await gapi.client.gmail.users.messages.send({ userId: 'me', resource: { raw } });
            logStatus('Email 已寄出至 ' + (data.contactEmail || '指定收件者'), 'success');
        } catch (err) {
            console.error(err);
            logStatus('Email 寄送失敗：' + err.message, 'error');
        } finally {
            setLoading('btnEmail', false);
        }
    }

    function blobToBase64(blob) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
                const data = reader.result.split(',')[1];
                resolve(data);
            };
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });
    }

    async function shareToLine() {
        try {
            setLoading('btnLine', true);
            const token = document.getElementById('lineTokenInput').value.trim();
            if(!token) throw new Error('請先在系統設定中填入 LINE Token');
            const data = await ensureQuoteData();
            if(!lastUploadLinks) {
                await handleDriveUpload();
            }
            const message = `📣 樂點創意報價單\n客戶：${data.clientName}\n主題：${data.eventName}\n含稅總價：${formatCurrency(data.totals.grand)}\n雲端連結：${lastUploadLinks ? lastUploadLinks.folderLink : '請見附件'}`;
            const res = await fetch('https://api.line.me/v2/bot/message/broadcast', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ messages: [{ type: 'text', text: message }] })
            });
            if(!res.ok) throw new Error('LINE API 回傳錯誤');
            logStatus('已透過 LINE broadcast 分享。', 'success');
        } catch (err) {
            console.error(err);
            logStatus('LINE 分享失敗：' + err.message, 'error');
        } finally {
            setLoading('btnLine', false);
        }
    }
