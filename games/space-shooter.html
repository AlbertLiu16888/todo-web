<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太空射擊</title>
<style>
  body { margin:0; background:#020617; color:#e2e8f0; font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
  .bar { display:flex; gap:24px; padding:16px; }
  .bar a { color:#94a3b8; text-decoration:none; }
  canvas { background:#000; border:2px solid #334155; border-radius:8px; height:min(640px, calc(100vh - 110px)); }
  .hint { color:#94a3b8; font-size:.9rem; padding:10px; }
</style>
</head>
<body>
<div class="bar"><a href="index.html">← 返回</a><b>🚀 太空射擊</b><span>分數 <b id="score">0</b></span><span>生命 <b id="hp">3</b></span><span>最高 <b id="best">0</b></span></div>
<canvas id="c" width="480" height="640"></canvas>
<div class="hint">方向鍵 / WASD 移動 · 按住空白鍵射擊 · 🟢 道具強化火力</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const store = { get(k){ try { return +localStorage.getItem(k) || 0; } catch { return 0; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
const keys = {};
let ship, bullets, enemies, eBullets, powerups, particles, score, hp, power, spawnT, fireT, invuln, frame, state = 'ready', best = store.get('shooter-best');
const stars = Array.from({length:90}, () => ({ x: Math.random()*cv.width, y: Math.random()*cv.height, s: Math.random()*2+0.5 }));
document.getElementById('best').textContent = best;

function reset() {
  ship = { x: cv.width/2, y: cv.height - 70, r: 14 };
  bullets = []; enemies = []; eBullets = []; powerups = []; particles = [];
  score = 0; hp = 3; power = 1; spawnT = 0; fireT = 0; invuln = 0; frame = 0; hud();
}
function hud() {
  document.getElementById('score').textContent = score; document.getElementById('hp').textContent = hp;
  if (score > best) { best = score; store.set('shooter-best', best); document.getElementById('best').textContent = best; }
}
function boom(x, y, color, n = 16) {
  for (let i = 0; i < n; i++) { const a = Math.random()*Math.PI*2, s = Math.random()*3+1; particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 30, color }); }
}
function spawnEnemy() {
  const difficulty = 1 + frame / 1800;
  const big = Math.random() < 0.15;
  enemies.push({ x: 20 + Math.random()*(cv.width-40), y: -20, r: big ? 22 : 14, hp: big ? 5 : 1, vy: (big ? 1 : 1.6 + Math.random()) * Math.min(difficulty, 2.5),
    vx: (Math.random()-0.5)*1.5, fireCd: 60 + Math.random()*90, pts: big ? 50 : 10, big });
}
function hit(a, b) { return Math.hypot(a.x - b.x, a.y - b.y) < a.r + b.r; }
function damage() {
  if (invuln > 0) return;
  hp--; invuln = 90; power = Math.max(1, power - 1); boom(ship.x, ship.y, '#60a5fa', 24); hud();
  if (hp <= 0) state = 'over';
}
function update() {
  frame++;
  const sp = 5;
  if (keys.ArrowLeft || keys.KeyA) ship.x -= sp; if (keys.ArrowRight || keys.KeyD) ship.x += sp;
  if (keys.ArrowUp || keys.KeyW) ship.y -= sp; if (keys.ArrowDown || keys.KeyS) ship.y += sp;
  ship.x = Math.max(ship.r, Math.min(cv.width - ship.r, ship.x)); ship.y = Math.max(ship.r, Math.min(cv.height - ship.r, ship.y));
  if (invuln > 0) invuln--;
  if ((keys.Space || touchFire) && --fireT <= 0) {
    fireT = 8;
    const spread = power >= 3 ? [-0.25, 0, 0.25] : power === 2 ? [-0.1, 0.1] : [0];
    spread.forEach(a => bullets.push({ x: ship.x, y: ship.y - 16, vx: Math.sin(a)*9, vy: -Math.cos(a)*9, r: 3 }));
  }
  if (--spawnT <= 0) { spawnEnemy(); spawnT = Math.max(18, 55 - frame / 120); }
  bullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
  eBullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
  powerups.forEach(p => { p.y += 1.8; });
  enemies.forEach(e => {
    e.y += e.vy; e.x += e.vx; if (e.x < e.r || e.x > cv.width - e.r) e.vx *= -1;
    if (--e.fireCd <= 0 && e.y > 0) {
      e.fireCd = 90 + Math.random()*90;
      const a = Math.atan2(ship.y - e.y, ship.x - e.x);
      eBullets.push({ x: e.x, y: e.y, vx: Math.cos(a)*3.5, vy: Math.sin(a)*3.5, r: 4 });
    }
  });
  for (const b of bullets) for (const e of enemies) if (e.hp > 0 && b.y > -10 && hit(b, e)) {
    b.y = -100; e.hp--;
    if (e.hp <= 0) { score += e.pts; hud(); boom(e.x, e.y, e.big ? '#f97316' : '#f87171'); if (Math.random() < (e.big ? 0.6 : 0.07)) powerups.push({ x: e.x, y: e.y, r: 10 }); }
  }
  for (const e of enemies) if (e.hp > 0 && hit(e, ship)) { e.hp = 0; boom(e.x, e.y, '#f87171'); damage(); }
  for (const b of eBullets) if (hit(b, ship)) { b.y = cv.height + 100; damage(); }
  for (const p of powerups) if (hit(p, ship)) { p.y = cv.height + 100; power = Math.min(3, power + 1); score += 25; hud(); }
  bullets = bullets.filter(b => b.y > -10 && b.x > -10 && b.x < cv.width + 10);
  eBullets = eBullets.filter(b => b.y < cv.height + 10 && b.y > -10 && b.x > -10 && b.x < cv.width + 10);
  enemies = enemies.filter(e => e.hp > 0 && e.y < cv.height + 30);
  powerups = powerups.filter(p => p.y < cv.height + 20);
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; }); particles = particles.filter(p => p.life > 0);
}
function drawShip(x, y) {
  ctx.fillStyle = '#60a5fa'; ctx.beginPath(); ctx.moveTo(x, y - 18); ctx.lineTo(x - 14, y + 14); ctx.lineTo(x, y + 7); ctx.lineTo(x + 14, y + 14); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.moveTo(x - 5, y + 10); ctx.lineTo(x, y + 18 + Math.random()*8); ctx.lineTo(x + 5, y + 10); ctx.fill();
}
function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  stars.forEach(s => { s.y += s.s * (state === 'play' ? 1 : 0.3); if (s.y > cv.height) { s.y = 0; s.x = Math.random()*cv.width; } ctx.fillStyle = `rgba(255,255,255,${s.s/2.5})`; ctx.fillRect(s.x, s.y, s.s, s.s); });
  if (state !== 'ready') {
    ctx.fillStyle = '#fde047'; bullets.forEach(b => ctx.fillRect(b.x - 2, b.y - 6, 4, 12));
    ctx.fillStyle = '#f472b6'; eBullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); });
    enemies.forEach(e => {
      ctx.fillStyle = e.big ? '#f97316' : '#ef4444';
      ctx.beginPath(); ctx.moveTo(e.x, e.y + e.r); ctx.lineTo(e.x - e.r, e.y - e.r*0.6); ctx.lineTo(e.x, e.y - e.r*0.2); ctx.lineTo(e.x + e.r, e.y - e.r*0.6); ctx.closePath(); ctx.fill();
    });
    powerups.forEach(p => { ctx.fillStyle = '#22c55e'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('P', p.x, p.y + 4); });
    particles.forEach(p => { ctx.globalAlpha = p.life / 30; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 3, 3); }); ctx.globalAlpha = 1;
    if (state === 'play' && !(invuln > 0 && Math.floor(invuln / 5) % 2)) drawShip(ship.x, ship.y);
  }
  if (state !== 'play') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 32px sans-serif';
    ctx.fillText(state === 'over' ? '遊戲結束' : state === 'pause' ? '暫停' : '太空射擊', cv.width/2, cv.height/2 - 10);
    ctx.font = '16px sans-serif'; ctx.fillText(state === 'pause' ? '按 P 繼續' : '按 Enter 或點擊開始', cv.width/2, cv.height/2 + 24);
  }
}
function loop() { if (state === 'play') update(); draw(); requestAnimationFrame(loop); }
function start() { if (state === 'ready' || state === 'over') { reset(); state = 'play'; } }
addEventListener('keydown', e => {
  if (e.code === 'Escape') { location.href = 'index.html'; return; }
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'Enter') start();
  if (e.code === 'KeyP' && state !== 'ready' && state !== 'over') state = state === 'play' ? 'pause' : 'play';
});
addEventListener('keyup', e => { keys[e.code] = false; });
// Touch: drag to move, auto-fire while touching
let touchFire = false;
function touchMove(t) { const r = cv.getBoundingClientRect(); ship.x = (t.clientX - r.left) * (cv.width / r.width); ship.y = (t.clientY - r.top) * (cv.height / r.height) - 40; }
cv.addEventListener('touchstart', e => { start(); touchFire = true; touchMove(e.touches[0]); e.preventDefault(); }, {passive:false});
cv.addEventListener('touchmove', e => { touchMove(e.touches[0]); e.preventDefault(); }, {passive:false});
cv.addEventListener('touchend', () => { touchFire = false; });
cv.addEventListener('click', start);
reset(); loop();
</script>
</body>
</html>
