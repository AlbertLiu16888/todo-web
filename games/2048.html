<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  body { margin:0; background:#faf8ef; color:#776e65; font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
  .bar { display:flex; gap:12px; align-items:center; padding:16px; width:min(440px, calc(100vw - 32px)); box-sizing:border-box; flex-wrap:wrap; }
  .bar a { color:#8f7a66; text-decoration:none; margin-right:auto; }
  .pill { background:#bbada0; color:#fff; border-radius:6px; padding:6px 12px; text-align:center; min-width:60px; }
  .pill small { display:block; font-size:.7rem; color:#eee4da; }
  button { background:#8f7a66; color:#fff; border:none; border-radius:6px; padding:10px 14px; font-weight:bold; cursor:pointer; font-size:.95rem; }
  #board { position:relative; width:min(440px, calc(100vw - 32px)); aspect-ratio:1; background:#bbada0; border-radius:10px; touch-action:none; }
  .cell, .tile { position:absolute; border-radius:6px; }
  .cell { background:rgba(238,228,218,0.35); }
  .tile { display:flex; align-items:center; justify-content:center; font-weight:bold; transition:left .1s ease, top .1s ease; }
  .tile.new { animation:pop .15s ease; }
  .tile.merged { animation:bump .15s ease; }
  @keyframes pop { from { transform:scale(0); } to { transform:scale(1); } }
  @keyframes bump { 50% { transform:scale(1.12); } }
  #msg { position:absolute; inset:0; background:rgba(238,228,218,0.75); border-radius:10px; display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; font-size:2.2rem; font-weight:bold; z-index:5; }
  #msg.show { display:flex; }
  .hint { padding:14px; font-size:.9rem; text-align:center; }
</style>
</head>
<body>
<div class="bar">
  <a href="index.html">← 返回</a>
  <div class="pill"><small>分數</small><b id="score">0</b></div>
  <div class="pill"><small>最高</small><b id="best">0</b></div>
  <button id="newBtn">新遊戲</button>
</div>
<div id="board"><div id="msg"><span id="msgText"></span><button id="retry">再玩一次</button></div></div>
<div class="hint">方向鍵 / WASD / 觸控滑動 · 合併相同數字，湊出 <b>2048</b>！</div>
<script>
const N = 4, board = document.getElementById('board');
const store = { get(k){ try { return +localStorage.getItem(k) || 0; } catch { return 0; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
const COLORS = { 2:['#eee4da','#776e65'], 4:['#ede0c8','#776e65'], 8:['#f2b179','#fff'], 16:['#f59563','#fff'], 32:['#f67c5f','#fff'], 64:['#f65e3b','#fff'],
  128:['#edcf72','#fff'], 256:['#edcc61','#fff'], 512:['#edc850','#fff'], 1024:['#edc53f','#fff'], 2048:['#edc22e','#fff'] };
let grid, score, best = store.get('2048-best'), won, keepGoing, nextId = 1;
document.getElementById('best').textContent = best;

function geo() { const size = board.clientWidth, gap = size * 0.03, cell = (size - gap * (N + 1)) / N; return { gap, cell }; }
function pos(i) { const { gap, cell } = geo(); return gap + i * (cell + gap); }
function drawCells() {
  board.querySelectorAll('.cell').forEach(c => c.remove());
  const { cell } = geo();
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const d = document.createElement('div'); d.className = 'cell';
    Object.assign(d.style, { left: pos(c) + 'px', top: pos(r) + 'px', width: cell + 'px', height: cell + 'px' });
    board.appendChild(d);
  }
}
function render() {
  const { cell } = geo(), seen = new Set();
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const t = grid[r][c]; if (!t) continue;
    seen.add(String(t.id));
    let el = board.querySelector(`.tile[data-id="${t.id}"]`);
    if (!el) { el = document.createElement('div'); el.className = 'tile new'; el.dataset.id = t.id; board.appendChild(el); }
    else el.className = 'tile' + (t.merged ? ' merged' : '');
    const [bg, fg] = COLORS[t.v] || ['#3c3a32', '#fff'];
    Object.assign(el.style, { left: pos(c) + 'px', top: pos(r) + 'px', width: cell + 'px', height: cell + 'px', background: bg, color: fg,
      fontSize: cell * (t.v < 100 ? 0.45 : t.v < 1000 ? 0.36 : 0.28) + 'px' });
    el.textContent = t.v;
  }
  board.querySelectorAll('.tile').forEach(el => { if (!seen.has(el.dataset.id)) el.remove(); });
  document.getElementById('score').textContent = score;
  if (score > best) { best = score; store.set('2048-best', best); document.getElementById('best').textContent = best; }
}
function addRandom() {
  const empty = []; for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) empty.push([r, c]);
  if (!empty.length) return;
  const [r, c] = empty[Math.floor(Math.random() * empty.length)];
  grid[r][c] = { v: Math.random() < 0.9 ? 2 : 4, id: nextId++ };
}
function newGame() {
  grid = Array.from({length:N}, () => Array(N).fill(null)); score = 0; won = false; keepGoing = false;
  board.querySelectorAll('.tile').forEach(el => el.remove());
  document.getElementById('msg').classList.remove('show');
  addRandom(); addRandom(); render();
}
// Slide one line toward index 0; returns new line and whether anything moved.
function slide(line) {
  const tiles = line.filter(Boolean), out = [];
  for (let i = 0; i < tiles.length; i++) {
    if (tiles[i + 1] && tiles[i].v === tiles[i + 1].v) {
      const v = tiles[i].v * 2; score += v; if (v === 2048) won = true;
      out.push({ v, id: tiles[i].id, merged: true }); i++;
    } else out.push({ ...tiles[i], merged: false });
  }
  while (out.length < N) out.push(null);
  const moved = out.some((t, i) => (t && t.id) !== (line[i] && line[i].id) || (t && t.merged));
  return { out, moved };
}
function move(dir) {
  if (document.getElementById('msg').classList.contains('show')) return;
  let moved = false;
  for (let k = 0; k < N; k++) {
    const idx = [...Array(N).keys()].map(i => dir === 'left' ? [k, i] : dir === 'right' ? [k, N - 1 - i] : dir === 'up' ? [i, k] : [N - 1 - i, k]);
    const { out, moved: m } = slide(idx.map(([r, c]) => grid[r][c]));
    idx.forEach(([r, c], i) => { grid[r][c] = out[i]; });
    moved = moved || m;
  }
  if (!moved) return;
  addRandom(); render();
  if (won && !keepGoing) return showMsg('你贏了！🎉', '繼續玩');
  if (!canMove()) showMsg('遊戲結束', '再玩一次');
}
function canMove() {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const t = grid[r][c]; if (!t) return true;
    if (c < N - 1 && grid[r][c + 1] && grid[r][c + 1].v === t.v) return true;
    if (r < N - 1 && grid[r + 1][c] && grid[r + 1][c].v === t.v) return true;
  }
  return false;
}
function showMsg(text, btn) { document.getElementById('msgText').textContent = text; document.getElementById('retry').textContent = btn; document.getElementById('msg').classList.add('show'); }
document.getElementById('retry').onclick = () => {
  if (won && !keepGoing && canMove()) { keepGoing = true; document.getElementById('msg').classList.remove('show'); } else newGame();
};
document.getElementById('newBtn').onclick = newGame;
const KEYMAP = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down' };
addEventListener('keydown', e => {
  if (e.code === 'Escape') { location.href = 'index.html'; return; }
  const d = KEYMAP[e.code]; if (d) { e.preventDefault(); move(d); }
});
let start = null;
board.addEventListener('pointerdown', e => { start = [e.clientX, e.clientY]; });
board.addEventListener('pointerup', e => {
  if (!start) return;
  const dx = e.clientX - start[0], dy = e.clientY - start[1]; start = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;
  move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
});
addEventListener('resize', () => { drawCells(); render(); });
drawCells(); newGame();
</script>
</body>
</html>
