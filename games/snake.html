<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>貪食蛇</title>
<style>
  body { margin:0; background:#0f172a; color:#e2e8f0; font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
  .bar { display:flex; gap:24px; align-items:center; padding:16px; }
  .bar a { color:#94a3b8; text-decoration:none; }
  canvas { background:#111827; border:2px solid #334155; border-radius:8px; max-width:calc(100vw - 32px); }
  .hint { color:#94a3b8; font-size:.9rem; padding:12px; text-align:center; }
</style>
</head>
<body>
<div class="bar"><a href="index.html">← 返回</a><b>🐍 貪食蛇</b><span>分數 <b id="score">0</b></span><span>最高 <b id="best">0</b></span></div>
<canvas id="c" width="480" height="480"></canvas>
<div class="hint">方向鍵 / WASD 控制 · 空白鍵 開始 / 暫停</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const N = 24, S = cv.width / N;
const store = { get(k){ try { return +localStorage.getItem(k) || 0; } catch { return 0; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
let snake, dir, nextDir, food, score, best = store.get('snake-best'), state = 'ready', tick, last = 0;
document.getElementById('best').textContent = best;

function reset() {
  snake = [{x:12,y:12},{x:11,y:12},{x:10,y:12}];
  dir = {x:1,y:0}; nextDir = dir; score = 0; tick = 130;
  placeFood(); updateScore();
}
function placeFood() {
  do { food = {x:Math.floor(Math.random()*N), y:Math.floor(Math.random()*N)}; }
  while (snake.some(s => s.x === food.x && s.y === food.y));
}
function updateScore() {
  document.getElementById('score').textContent = score;
  if (score > best) { best = score; store.set('snake-best', best); document.getElementById('best').textContent = best; }
}
function step() {
  dir = nextDir;
  const h = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some(s => s.x === h.x && s.y === h.y)) { state = 'over'; return; }
  snake.unshift(h);
  if (h.x === food.x && h.y === food.y) { score += 10; tick = Math.max(55, tick - 3); placeFood(); updateScore(); }
  else snake.pop();
}
function draw() {
  ctx.fillStyle = '#111827'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  for (let i = 0; i <= N; i++) { ctx.beginPath(); ctx.moveTo(i*S,0); ctx.lineTo(i*S,cv.height); ctx.moveTo(0,i*S); ctx.lineTo(cv.width,i*S); ctx.stroke(); }
  ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(food.x*S+S/2, food.y*S+S/2, S/2-2, 0, Math.PI*2); ctx.fill();
  snake.forEach((s,i) => { ctx.fillStyle = i === 0 ? '#4ade80' : `hsl(142,70%,${45 - Math.min(i,20)}%)`; ctx.fillRect(s.x*S+1, s.y*S+1, S-2, S-2); });
  if (state !== 'play') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 30px sans-serif';
    ctx.fillText(state === 'over' ? '遊戲結束' : state === 'pause' ? '暫停' : '貪食蛇', cv.width/2, cv.height/2 - 10);
    ctx.font = '16px sans-serif'; ctx.fillText('按空白鍵' + (state === 'pause' ? '繼續' : '開始'), cv.width/2, cv.height/2 + 24);
  }
}
function loop(t) {
  if (state === 'play' && t - last > tick) { last = t; step(); }
  draw(); requestAnimationFrame(loop);
}
const DIRS = { ArrowUp:[0,-1], KeyW:[0,-1], ArrowDown:[0,1], KeyS:[0,1], ArrowLeft:[-1,0], KeyA:[-1,0], ArrowRight:[1,0], KeyD:[1,0] };
addEventListener('keydown', e => {
  if (e.code === 'Escape') { location.href = 'index.html'; return; }
  if (e.code === 'Space') {
    e.preventDefault();
    if (state === 'over' || state === 'ready') { reset(); state = 'play'; }
    else state = state === 'play' ? 'pause' : 'play';
    return;
  }
  const d = DIRS[e.code]; if (!d) return;
  e.preventDefault();
  if (state === 'ready') { state = 'play'; }
  if (d[0] !== -dir.x || d[1] !== -dir.y) nextDir = {x:d[0], y:d[1]};
});
// Touch: swipe to steer, tap to start/pause
let ts = null;
cv.addEventListener('touchstart', e => { ts = e.touches[0]; e.preventDefault(); }, {passive:false});
cv.addEventListener('touchend', e => {
  const t = e.changedTouches[0], dx = t.clientX - ts.clientX, dy = t.clientY - ts.clientY;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) { dispatchEvent(new KeyboardEvent('keydown', {code:'Space'})); return; }
  const code = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'ArrowRight' : 'ArrowLeft') : (dy > 0 ? 'ArrowDown' : 'ArrowUp');
  dispatchEvent(new KeyboardEvent('keydown', {code}));
});
reset(); requestAnimationFrame(loop);
</script>
</body>
</html>
